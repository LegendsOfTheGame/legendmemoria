# Rebuild the combined Dalamud repo.json from each plugin's own repo.json.
# Commits only when a plugin changed, which also redeploys GitHub Pages.
name: Build repo.json

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.json, tools/build_repo.py]

permissions:
  contents: write
  pages: write

concurrency:
  group: build-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_repo.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- repo.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Update repo.json"
          git push
          # A push made with GITHUB_TOKEN may not start a Pages build, so ask for one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
