# Copy Apex (Game-Challenge-Tracker) and the Adventurer's Ledger (pandora-lunar) into
# apex/ and lunar/. Commits only when a copied file changed, which also redeploys GitHub Pages.
name: Sync Apex and Lunar

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/sync_apps.py, .github/workflows/sync-apps.yml]

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-apps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LegendsOfTheGame/Game-Challenge-Tracker
          path: _src/gct
      - uses: actions/checkout@v4
        with:
          repository: LegendsOfTheGame/pandora-lunar
          path: _src/lunar
      - run: python3 tools/sync_apps.py _src/gct _src/lunar
      - name: Commit if changed
        run: |
          if git diff --quiet -- apex lunar && [ -z "$(git ls-files --others --exclude-standard -- apex lunar)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apex lunar
          git commit -m "Sync Apex and Lunar" -m "Game-Challenge-Tracker $(git -C _src/gct rev-parse --short HEAD), pandora-lunar $(git -C _src/lunar rev-parse --short HEAD)."
          git push
          # A push made with GITHUB_TOKEN may not start a Pages build, so ask for one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
